# One-click hosting on Render.com: New > Blueprint, point it at this repository.
# The disk keeps the database and uploaded shot records safe across restarts and deploys.
services:
  - type: web
    name: hotdiggity
    runtime: node
    plan: starter
    rootDir: hotdiggity-app
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: SITE_URL
        value: https://hotdiggitydogresort.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: Hot Diggity Dog Resort <info@hotdiggitydogresort.com>
      - key: STAFF_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 5
